  <text x="287" y="31" text-anchor="middle" font-size="13" font-weight="700" fill="#003380">② 트랙 A: 연속 신경장 (SigNerd)</text>
  <rect x="176" y="42" width="222" height="70" rx="4" fill="#FFFFFF" stroke="#A0A0A0"/>
  <text x="287" y="64" text-anchor="middle" font-size="11" fill="#282945">• 직선화 흐름(Rectified Flow) 잠재 생성</text>
  <text x="287" y="84" text-anchor="middle" font-size="11" fill="#282945">• 하이퍼네트워크 3D 함수 f_θ(x,y,z) 합성</text>
  <text x="287" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#D55E00">→ 전극 배치 무관 임의 좌표 제로샷 복원</text>

