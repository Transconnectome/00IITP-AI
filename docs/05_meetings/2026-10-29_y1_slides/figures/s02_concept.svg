  <text x="300" y="280" text-anchor="middle" font-size="12.5" font-weight="700" fill="#003380">핵심 원리: 이산 격자 대신 ‘연속 시공간 함수’로 뇌신호 모델링 → 센서 배치·결측 무관 통합 복원</text>
