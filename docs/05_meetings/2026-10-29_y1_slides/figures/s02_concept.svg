  <text x="287" y="188" text-anchor="middle" font-size="11" fill="#282945">• 뇌파 기초모델(DIVER-1) 의미 특징 정렬</text>
  <text x="287" y="208" text-anchor="middle" font-size="11" fill="#282945">• 뇌영상(fMRI) 연속 시공간 신경장 보간</text>
  <text x="287" y="227" text-anchor="middle" font-size="11" font-weight="700" fill="#003380">→ 측두엽 결측 · 움직임 구간 100% 구제</text>

