version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-docker
    ports:
      - "11435:11434" # Host Port 11435 maps to Container Port 11434
    volumes:
      - ollama_storage:/root/.ollama
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434 # Internal docker network communication
    volumes:
      - open-webui_storage:/app/backend/data
    restart: always
    depends_on:
      - ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  ollama_storage:
  open-webui_storage:
